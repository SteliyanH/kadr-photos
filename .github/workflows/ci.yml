name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift test

      # `swift test` runs on macOS, where every `#if os(iOS)` and
      # `#if canImport(UIKit)` body is excluded — 86 lines here. This package
      # compiles for iOS today; nothing was checking that it stayed that way.
      #
      # kadr-audio had the identical gap and its iOS slice did not compile at all,
      # through six releases, with a green suite the whole time. Prevention here,
      # not a fix.
      - name: Build for iOS
        run: xcodebuild -scheme KadrPhotos -destination 'generic/platform=iOS' -quiet build
