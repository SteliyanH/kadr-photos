name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      # The README is the first code anyone runs. Tools/readme-snippets.sh
      # copies every ```swift block into Examples/ReadmeSnippets.swift, which
      # the KadrPhotosExamples target compiles: `swift test` builds it on macOS
      # and the iOS step below builds it for iOS. This step fails if that copy
      # is stale, so a README edit cannot skip the compiler.
      - name: README snippets are current
        run: Tools/readme-snippets.sh --check

      - run: swift test

      # `swift test` runs on macOS, where every `#if os(iOS)` and
      # `#if canImport(UIKit)` body is excluded — 86 lines here. This package
      # compiles for iOS today; nothing was checking that it stayed that way.
      #
      # kadr-audio had the identical gap and its iOS slice did not compile at all,
      # through six releases, with a green suite the whole time. Prevention here,
      # not a fix.
      #
      # KadrPhotos-Package is a shared scheme (.swiftpm/xcode/xcshareddata)
      # that builds the library and KadrPhotosExamples, so the README snippets
      # compile for iOS too. Xcode only generates an all-targets scheme for a
      # package with more than one product, and the examples are not a product.
      - name: Build for iOS
        run: xcodebuild -scheme KadrPhotos-Package -destination 'generic/platform=iOS' -quiet build
